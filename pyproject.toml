[project]
name = "football-analytics"
version = "0.1.0"
description = "Player statistics database and scouting dashboard, sourced from FotMob"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "supabase>=2.9",
    "python-dotenv>=1.0",
    "streamlit>=1.62.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "reportlab>=5.0.1",
    "kaleido>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_analytics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
